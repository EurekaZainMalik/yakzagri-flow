name: CI

# Frontend-only CI: lint, build, unit tests, a11y, and visual regression
# for the Next.js application. The backend/contracts/mobile gates live in
# the yakzagri-flow backend repository.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
      - "pnpm-lock.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
      - "pnpm-lock.yaml"

jobs:
  changes:
    name: Detect Frontend Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/pnpm-lock.yaml'

  frontend-quality:
    name: Frontend Lint, Types & Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce pnpm-only lockfile
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json || -f yarn.lock ]]; then
            echo "Only pnpm-lock.yaml may be committed in frontend/."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: node ../scripts/check-audit-waivers.mjs npm frontend frontend

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test --ci --json

      - name: A11y axe audit (blocking)
        run: pnpm test -- src/__tests__/accessibility --verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

  frontend:
    name: Frontend Required Gate
    runs-on: ubuntu-latest
    needs: [changes, frontend-quality, frontend-test, frontend-build]
    if: always()
    steps:
      - name: Verify frontend jobs
        if: needs.changes.result != 'success' || (needs.changes.outputs.frontend == 'true' && (needs.frontend-quality.result != 'success' || needs.frontend-test.result != 'success' || needs.frontend-build.result != 'success'))
        run: exit 1

      - name: Skip note (no frontend file changes)
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend file changes detected, required gate passed."

  visual-regression:
    name: Visual Regression (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Install Playwright browsers (Chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Build Next.js app
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

      - name: Run visual regression suite
        run: pnpm exec playwright test --project=chromium-desktop --project=chromium-mobile tests/visual
        env:
          CI: true
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

      - name: Upload visual regression report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
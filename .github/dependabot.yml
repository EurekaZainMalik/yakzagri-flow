# Dependabot configuration — grouped update PRs by risk.
# Complements the blocking audit gate in .github/workflows/security-audit.yml (issue #204).
version: 2
updates:
  # ---- Frontend (npm) ----
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    # Direct dependencies are pinned in package.json, so updates change the
    # manifest and lockfile together to keep installs reproducible.
    versioning-strategy: increase
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies
      - frontend
    groups:
      frontend-low-risk:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    groups:
      actions-all:
        patterns:
          - "*"